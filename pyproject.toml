[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ytclip"
version = "1.0.0"
description = "Free YouTube clipper — Cloudflare + GitHub Actions hybrid"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.9"
authors = [
    {name = "Rahul Rajarapu", email = "rahulrajarapu158@gmail.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "flask>=3.0",
    "yt-dlp>=2024.1",
]

[project.optional-dependencies]
dev = ["gunicorn>=21.2", "pytest"]

[project.urls]
Homepage = "https://github.com/rahulrajarapu158-arch/ytclip"
Repository = "https://github.com/rahulrajarapu158-arch/ytclip"

[tool.setuptools.packages.find]
where = ["src"]
