name = "ytclip-worker"
main = "worker.js"
compatibility_date = "2024-01-01"

# KV Namespace for job queue
[[kv_namespaces]]
binding = "YTCLIP_KV"
id = "55c402c8accd427591e072f475148962"
preview_id = "55c402c8accd427591e072f475148962"

# Environment variables
[vars]
GITHUB_REPO = "dexlot8-droid/ytclip"
FILE_HOST = "catbox.moe"

# Secrets to set via `wrangler secret put`:
# - GITHUB_TOKEN (GitHub Personal Access Token with `repo` scope)
# - WEBHOOK_SECRET (random string for webhook verification)
