<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ytclip - YouTube Clip Downloader</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0d1117; color: #c9d1d9; max-width: 800px; margin: 0 auto; padding: 20px; }
        h1 { color: #58a6ff; }
        .card { background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 20px; margin: 16px 0; }
        label { display: block; margin: 12px 0 4px; font-weight: 600; }
        input, select, textarea { width: 100%; padding: 8px 12px; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; color: #c9d1d9; box-sizing: border-box; }
        button { background: #238636; color: white; border: none; padding: 12px 24px; border-radius: 6px; font-weight: 600; cursor: pointer; margin-top: 16px; }
        button:hover { background: #2ea043; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .status { padding: 12px; border-radius: 6px; margin: 12px 0; display: none; }
        .status.info { background: #1f6feb33; border: 1px solid #1f6feb; display: block; }
        .status.success { background: #23863633; border: 1px solid #238636; display: block; }
        .status.error { background: #da363333; border: 1px solid #da3633; display: block; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .badge { background: #9e6a03; color: #000; padding: 2px 8px; border-radius: 12px; font-size: 12px; font-weight: 700; }
        video { width: 100%; max-height: 400px; border-radius: 6px; margin: 16px 0; }
        a.download { display: inline-block; background: #30363d; color: #c9d1d9; padding: 10px 20px; border-radius: 6px; text-decoration: none; font-weight: 600; }
        a.download:hover { background: #444c56; }
        pre { background: #0d1117; padding: 16px; border-radius: 6px; overflow-x: auto; max-height: 400px; white-space: pre-wrap; border: 1px solid #30363d; }
    </style>
</head>
<body>
    <h1>ytclip <span style="font-size:16px;color:#8b949e">YouTube clip downloader</span></h1>
    <p>Download · Trim · Transcript</p>

    <div class="card">
        <h2>Process Video</h2>
        <label>YouTube URL</label>
        <input type="text" id="url" placeholder="https://youtube.com/watch?v=...">
        
        <div class="grid">
            <div>
                <label>Start (optional)</label>
                <input type="text" id="start" placeholder="0:00">
            </div>
            <div>
                <label>End (optional)</label>
                <input type="text" id="end" placeholder="1:00">
            </div>
        </div>

        <div class="grid">
            <div>
                <label>Quality</label>
                <select id="quality">
                    <option value="480">480p (Free)</option>
                    <option value="720">720p</option>
                    <option value="1080">1080p <span class="badge">Pro</span></option>
                    <option value="2160">4K <span class="badge">Pro</span></option>
                </select>
            </div>
            <div>
                <label>Format</label>
                <select id="format">
                    <option value="text">Plain Text</option>
                    <option value="srt">SRT</option>
                    <option value="vtt">VTT</option>
                </select>
            </div>
        </div>

        <label style="margin-top:12px"><input type="checkbox" id="transcript" checked> Include Transcript</label>

        <button onclick="process()">Process</button>
        <div class="status" id="status"></div>
        <div id="result"></div>
    </div>

    <script>
        function show(msg, type) {
            const s = document.getElementById('status');
            s.textContent = msg;
            s.className = 'status ' + type;
        }

        async function process() {
            const url = document.getElementById('url').value.trim();
            const start = document.getElementById('start').value.trim();
            const end = document.getElementById('end').value.trim();
            const quality = document.getElementById('quality').value;
            const format = document.getElementById('format').value;
            const transcript = document.getElementById('transcript').checked;

            if (!url) return show('Please enter a URL', 'error');

            document.querySelector('button').disabled = true;
            show('Processing...', 'info');

            try {
                const res = await fetch('/api/process', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        url, start, end, quality,
                        format: transcript ? format : 'none',
                        lang: 'en'
                    })
                }).then(r => r.json());

                if (res.error) {
                    show(res.error, 'error');
                } else {
                    show('Done!', 'success');
                    let html = '';
                    if (res.file) {
                        html += `<video controls src="/api/file/${encodeURIComponent(res.file)}"></video>`;
                        html += `<a class="download" href="/api/file/${encodeURIComponent(res.file)}" download>Download MP4</a>`;
                    }
                    if (res.transcript) {
                        html += `<h3>Transcript</h3><pre>${res.transcript.substring(0,5000)}</pre>`;
                    }
                    document.getElementById('result').innerHTML = html;
                }
            } catch (e) {
                show('Error: ' + e.message, 'error');
            }
            document.querySelector('button').disabled = false;
        }
    </script>
</body>
</html>
