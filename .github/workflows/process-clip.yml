name: Process YouTube Clip

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: 'Job ID from Worker'
        required: true
        type: string
      url:
        description: 'YouTube URL'
        required: true
        type: string
      start:
        description: 'Start time (HH:MM:SS or seconds)'
        required: true
        type: string
      end:
        description: 'End time (HH:MM:SS or seconds)'
        required: false
        type: string
        default: ''
      quality:
        description: 'Video quality'
        required: false
        type: string
        default: '480'
      format:
        description: 'Output format'
        required: false
        type: string
        default: 'mp4'

jobs:
  process:
    runs-on: ubuntu-latest
    
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg python3-pip curl rclone
          pip3 install --quiet yt-dlp

      - name: Download YouTube clip
        id: download
        run: |
          JOB_ID="${{ github.event.inputs.job_id }}"
          URL="${{ github.event.inputs.url }}"
          START="${{ github.event.inputs.start }}"
          END="${{ github.event.inputs.end }}"
          QUALITY="${{ github.event.inputs.quality }}"
          FORMAT="${{ github.event.inputs.format }}"
          
          # Calculate output filename
          VIDEO_ID=$(yt-dlp --no-warnings --skip-download --print id "$URL" 2>/dev/null || echo "unknown")
          OUTPUT_FILE="${VIDEO_ID}_${QUALITY}_${START//[:]/-}_${END//[:]/-}.${FORMAT}"
          
          # Build yt-dlp options
          YTDL_OPTS=(
            --no-warnings
            -f "bestvideo[height<=${QUALITY}]+bestaudio/best[height<=${QUALITY}]"
            --merge-output-format "$FORMAT"
          )
          
          # Add time range if specified
          if [ -n "$START" ] && [ -n "$END" ]; then
            YTDL_OPTS+=("--download-sections" "*${START}-${END}")
          fi
          
          YTDL_OPTS+=(-o "$OUTPUT_FILE" "$URL")
          
          echo "Downloading: yt-dlp ${YTDL_OPTS[*]}"
          yt-dlp "${YTDL_OPTS[@]}"
          
          # Verify file was created
          if [ ! -f "$OUTPUT_FILE" ]; then
            echo "Error: Download failed" >&2
            exit 1
          fi
          
          FILE_SIZE=$(stat -c%s "$OUTPUT_FILE" 2>/dev/null || stat -f%z "$OUTPUT_FILE" 2>/dev/null || echo "unknown")
          echo "Downloaded: $OUTPUT_FILE ($FILE_SIZE bytes)"
          
          # Output for next steps
          echo "output_file=$OUTPUT_FILE" >> $GITHUB_OUTPUT
          echo "file_size=$FILE_SIZE" >> $GITHUB_OUTPUT

      - name: Upload to Cloudflare R2
        id: upload
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          OUTPUT_FILE="${{ steps.download.outputs.output_file }}"
          JOB_ID="${{ github.event.inputs.job_id }}"
          
          # Configure rclone for R2
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf << EOF
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = $R2_ACCESS_KEY
          secret_access_key = $R2_SECRET_KEY
          endpoint = $R2_ENDPOINT
          region = auto
          no_check_bucket = true
          EOF
          
          # Upload to R2
          R2_KEY="clips/${JOB_ID}/${OUTPUT_FILE}"
          rclone copy "$OUTPUT_FILE" "r2:$R2_BUCKET/$R2_KEY" --s3-no-check-bucket
          
          echo "Uploaded to R2: $R2_KEY"
          echo "r2_key=$R2_KEY" >> $GITHUB_OUTPUT

      - name: Notify Worker (success)
        if: success()
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: |
          JOB_ID="${{ github.event.inputs.job_id }}"
          R2_KEY="${{ steps.upload.outputs.r2_key }}"
          R2_PUBLIC_URL="${{ secrets.R2_PUBLIC_URL }}"
          
          # Build clip URL
          CLIP_URL="${R2_PUBLIC_URL}/${R2_KEY}"
          
          # Call webhook
          curl -sS -X POST "$WORKER_URL/api/webhook" \
            -H "Content-Type: application/json" \
            -d "{
              \"job_id\": \"$JOB_ID\",
              \"status\": \"done\",
              \"clip_url\": \"$CLIP_URL\"
            }" || echo "Webhook failed, job marked done locally"
          
          echo "Notified worker: job $JOB_ID done"

      - name: Notify Worker (failure)
        if: failure()
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
        run: |
          JOB_ID="${{ github.event.inputs.job_id }}"
          
          curl -sS -X POST "$WORKER_URL/api/webhook" \
            -H "Content-Type: application/json" \
            -d "{
              \"job_id\": \"$JOB_ID\",
              \"status\": \"error\",
              \"error\": \"Processing failed. Check GitHub Actions logs.\"
            }" || echo "Webhook call failed"
