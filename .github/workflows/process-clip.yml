name: Process YouTube Clip

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: 'Job ID from Worker'
        required: true
        type: string
      url:
        description: 'YouTube URL'
        required: true
        type: string
      start:
        description: 'Start time (HH:MM:SS or seconds)'
        required: true
        type: string
      end:
        description: 'End time (HH:MM:SS or seconds)'
        required: false
        type: string
        default: ''
      quality:
        description: 'Video quality'
        required: false
        type: string
        default: '480'
      format:
        description: 'Output format'
        required: false
        type: string
        default: 'mp4'

jobs:
  process:
    runs-on: ubuntu-latest
    
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg python3-pip curl
          pip3 install --quiet yt-dlp

      - name: Download YouTube clip
        id: download
        run: |
          JOB_ID="${{ github.event.inputs.job_id }}"
          URL="${{ github.event.inputs.url }}"
          START="${{ github.event.inputs.start }}"
          END="${{ github.event.inputs.end }}"
          QUALITY="${{ github.event.inputs.quality }}"
          FORMAT="${{ github.event.inputs.format }}"
          
          # Calculate output filename
          VIDEO_ID=$(yt-dlp --no-warnings --skip-download --print id "$URL" 2>/dev/null || echo "unknown")
          OUTPUT_FILE="${VIDEO_ID}_${QUALITY}_${START//[:]/-}_${END//[:]/-}.${FORMAT}"
          
          # Build yt-dlp options
          YTDL_OPTS=(
            --no-warnings
            -f "bestvideo[height<=${QUALITY}]+bestaudio/best[height<=${QUALITY}]"
            --merge-output-format "$FORMAT"
          )
          
          # Add time range if specified
          if [ -n "$START" ] && [ -n "$END" ]; then
            YTDL_OPTS+=("--download-sections" "*${START}-${END}")
          fi
          
          YTDL_OPTS+=(-o "$OUTPUT_FILE" "$URL")
          
          echo "Downloading: yt-dlp ${YTDL_OPTS[*]}"
          yt-dlp "${YTDL_OPTS[@]}"
          
          # Verify file was created
          if [ ! -f "$OUTPUT_FILE" ]; then
            echo "Error: Download failed" >&2
            exit 1
          fi
          
          FILE_SIZE=$(stat -c%s "$OUTPUT_FILE" 2>/dev/null || stat -f%z "$OUTPUT_FILE" 2>/dev/null || echo "unknown")
          echo "Downloaded: $OUTPUT_FILE ($FILE_SIZE bytes)"
          
          # Output for next steps
          echo "output_file=$OUTPUT_FILE" >> $GITHUB_OUTPUT
          echo "file_size=$FILE_SIZE" >> $GITHUB_OUTPUT

      - name: Upload to Catbox.moe
        id: upload
        run: |
          OUTPUT_FILE="${{ steps.download.outputs.output_file }}"
          JOB_ID="${{ github.event.inputs.job_id }}"
          
          # Upload to Catbox.moe (free, no signup, 200MB limit)
          echo "Uploading to Catbox.moe..."
          UPLOAD_RESP=$(curl -s -F "reqtype=fileupload" -F "fileToUpload=@${OUTPUT_FILE}" "https://catbox.moe/user/api.php")
          
          echo "Catbox response: $UPLOAD_RESP"
          
          # Validate response is a URL
          if [[ "$UPLOAD_RESP" =~ ^https?:// ]]; then
            echo "Upload successful: $UPLOAD_RESP"
            echo "clip_url=$UPLOAD_RESP" >> $GITHUB_OUTPUT
          else
            echo "Catbox upload failed, trying litterbox as fallback..."
            # Fallback: litterbox (catbox temporary)
            UPLOAD_RESP=$(curl -s -F "reqtype=fileupload" -F "time=72h" -F "fileToUpload=@${OUTPUT_FILE}" "https://litterbox.catbox.moe/resources/internals/api.php")
            echo "Litterbox response: $UPLOAD_RESP"
            if [[ "$UPLOAD_RESP" =~ ^https?:// ]]; then
              echo "Fallback upload successful: $UPLOAD_RESP"
              echo "clip_url=$UPLOAD_RESP" >> $GITHUB_OUTPUT
            else
              echo "All uploads failed" >&2
              exit 1
            fi
          fi

      - name: Notify Worker (success)
        if: success()
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: |
          JOB_ID="${{ github.event.inputs.job_id }}"
          CLIP_URL="${{ steps.upload.outputs.clip_url }}"
          
          # Call webhook
          curl -sS -X POST "$WORKER_URL/api/webhook" \
            -H "Content-Type: application/json" \
            -d "{
              \"job_id\": \"$JOB_ID\",
              \"status\": \"done\",
              \"clip_url\": \"$CLIP_URL\"
            }" || echo "Webhook failed, job marked done locally"
          
          echo "Notified worker: job $JOB_ID done"

      - name: Notify Worker (failure)
        if: failure()
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
        run: |
          JOB_ID="${{ github.event.inputs.job_id }}"
          
          curl -sS -X POST "$WORKER_URL/api/webhook" \
            -H "Content-Type: application/json" \
            -d "{
              \"job_id\": \"$JOB_ID\",
              \"status\": \"error\",
              \"error\": \"Processing failed. Check GitHub Actions logs.\"
            }" || echo "Webhook call failed"
